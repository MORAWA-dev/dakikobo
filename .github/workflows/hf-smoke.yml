name: Hugging Face Space smoke test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "DakiKobo app URL"
        required: false
        default: "https://kimcomehome-dakikobo.hf.space"
      strict:
        description: "Fail when hard pass-rate is below min-pass-rate (advisory keyword checks never fail CI)"
        required: false
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
      min_pass_rate:
        description: "Minimum hard-check pass rate (0.0-1.0) when strict=true"
        required: false
        default: "0.75"
  schedule:
    - cron: "30 5 * * *"

jobs:
  evaluate-space:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install evaluator dependency
        run: python -m pip install requests==2.31.0

      - name: Run public Space evaluation
        run: |
          BASE_URL="${{ inputs.base_url || 'https://kimcomehome-dakikobo.hf.space' }}"
          STRICT="${{ inputs.strict || 'true' }}"
          MIN_PASS_RATE="${{ inputs.min_pass_rate || '0.75' }}"
          ARGS=(
            --base-url "$BASE_URL"
            --output reports/rag_eval_results.md
            --timeout 180
            --wait-timeout 420
            --min-pass-rate "$MIN_PASS_RATE"
          )
          if [ "$STRICT" = "true" ]; then
            ARGS+=(--strict)
          fi
          python scripts/evaluate_rag.py "${ARGS[@]}"

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-report
          path: reports/rag_eval_results.md
          if-no-files-found: warn
